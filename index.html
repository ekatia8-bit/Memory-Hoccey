<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хоккейное Мемори</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 30px,
                    rgba(0,0,0,0.1) 30px,
                    rgba(0,0,0,0.1) 32px
                ),
                linear-gradient(
                    180deg,
                    #1a0000 0%,
                    #4a0000 15%,
                    #8B0000 30%,
                    #DC143C 45%,
                    #FF2400 55%,
                    #DC143C 70%,
                    #B22222 80%,
                    #F0F8FF 85%,
                    #E6F3FF 90%,
                    #FFFFFF 100%
                );
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255,255,255,0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background: 
                linear-gradient(90deg, 
                    transparent 0%, 
                    transparent 48%, 
                    rgba(220,20,60,0.3) 48%, 
                    rgba(220,20,60,0.3) 52%, 
                    transparent 52%, 
                    transparent 100%
                );
            pointer-events: none;
            z-index: 0;
        }

        .flying-puck {
            position: fixed;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 1;
            pointer-events: auto;
            transition: transform 0.3s ease;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }

        .flying-puck svg {
            width: 100%;
            height: 100%;
        }

        .flying-puck:hover {
            transform: scale(1.2);
        }

        .flying-puck.flipping {
            animation: puckFlip 0.8s ease;
        }

        @keyframes puckFlip {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.3); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at center, rgba(139,0,0,0.95) 0%, rgba(0,0,0,0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            animation: fadeIn 0.5s ease;
            gap: 30px;
        }

        .splash-screen img {
            max-width: 85%;
            max-height: 70%;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(220,20,60,0.8), 0 0 100px rgba(220,20,60,0.4);
            animation: zoomIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .start-btn {
            background: linear-gradient(135deg, #FF2400 0%, #DC143C 40%, #8B0000 100%);
            color: #fff;
            border: 3px solid #fff;
            padding: 22px 60px;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 8px 30px rgba(220,20,60,0.8),
                0 0 40px rgba(255,36,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.3);
            font-family: inherit;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .start-btn:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 
                0 12px 40px rgba(220,20,60,1),
                0 0 60px rgba(255,36,0,0.8),
                inset 0 2px 4px rgba(255,255,255,0.4);
            background: linear-gradient(135deg, #FF4500 0%, #FF2400 40%, #DC143C 100%);
        }

        .start-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2500;
        }

        .video-overlay.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        .video-overlay video {
            max-width: 95%;
            max-height: 95%;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(220,20,60,0.8);
        }

        h1 {
            color: #fff;
            font-size: clamp(1.5rem, 4vw, 3rem);
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7), 0 0 20px rgba(255,255,255,0.3);
            animation: titlePulse 2s ease-in-out infinite;
            text-align: center;
            position: relative;
            z-index: 2;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .controls {
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }

        .level-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        .level-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            color: #DC143C;
            border-color: #fff;
            box-shadow: 0 4px 15px rgba(255,255,255,0.4);
        }

        .sound-toggle {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .sound-toggle:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.05);
        }

        .sound-toggle.muted {
            opacity: 0.5;
            border-color: #ff6b6b;
        }

        .header {
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }

        .progress-container {
            flex: 1;
            min-width: 150px;
            max-width: 400px;
            background: rgba(255,255,255,0.2);
            border-radius: 25px;
            height: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.4);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #fff 0%, #FFD700 50%, #fff 100%);
            border-radius: 25px;
            transition: width 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 0%;
            box-shadow: 0 0 15px rgba(255,215,0,0.6);
        }

        .stats {
            color: #fff;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 600;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .restart-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            color: #DC143C;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        .restart-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .restart-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .game-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            z-index: 2;
            min-height: 0;
            overflow: hidden;
        }

        .game-board {
            display: grid;
            gap: clamp(8px, 2vw, 20px);
            perspective: 1000px;
        }

        .game-board.size-3x3 { 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
        }

        .game-board.size-3x4 { 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(3, 1fr);
        }

        .game-board.size-4x4 { 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(4, 1fr);
        }

        .card {
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            aspect-ratio: 1;
            width: 100%;
            height: auto;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: matchBounce 0.6s ease;
        }

        .card.error {
            animation: shake 0.5s ease;
        }

        .card.logo-center {
            cursor: default;
            transform: none !important;
        }

        .card.logo-center .card-face {
            background: linear-gradient(135deg, #fff 0%, #f5f6fa 100%);
            border: 3px solid #DC143C;
            box-shadow: 0 0 25px rgba(220,20,60,0.6);
            animation: logoGlow 2s ease-in-out infinite;
        }

        .card.logo-center .card-face img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(220,20,60,0.6); }
            50% { box-shadow: 0 0 40px rgba(220,20,60,0.9), 0 0 60px rgba(255,36,0,0.4); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotateY(180deg); }
            20% { transform: translateX(-8px) rotateY(180deg); }
            40% { transform: translateX(8px) rotateY(180deg); }
            60% { transform: translateX(-8px) rotateY(180deg); }
            80% { transform: translateX(8px) rotateY(180deg); }
        }

        @keyframes matchBounce {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: clamp(8px, 2vw, 16px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: box-shadow 0.3s ease;
            overflow: hidden;
        }

        .card-face:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .card-front {
            background: #1a1a2e;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-front::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(220,20,60,0.3) 0%, rgba(139,0,0,0.3) 100%);
            pointer-events: none;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #fff 0%, #f5f6fa 100%);
            border: 2px solid rgba(220,20,60,0.3);
            padding: 3%;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .card-back .image-error {
            font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            color: #DC143C;
            text-align: center;
            padding: 5px;
            font-weight: 600;
            word-break: break-all;
        }

        .card-back.success {
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
            border: 3px solid #00ff88;
        }

        .card-back.error-flash {
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.8);
            border: 3px solid #ff4757;
        }

        .win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            padding: 20px;
        }

        .win-modal.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .win-content {
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #8B0000 100%);
            padding: clamp(25px, 5vw, 40px);
            border-radius: 20px;
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(255,255,255,0.2);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 450px;
            width: 90%;
            border: 2px solid rgba(255,255,255,0.3);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .win-content h2 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .win-content p {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            margin-bottom: 15px;
        }

        .fact-box {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            line-height: 1.5;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .next-level-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #8B0000;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
            font-family: inherit;
            margin-right: 10px;
        }

        .next-level-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255,215,0,0.6);
        }

        .next-level-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 15px 22px;
            border-radius: 10px;
            z-index: 2000;
            max-width: 300px;
            font-size: 0.95rem;
            display: none;
            animation: slideIn 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .status-message.show {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .game-board {
                gap: clamp(4px, 1.5vw, 10px);
            }
            
            .flying-puck {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <img src="images/ZAS1.png" alt="Заставка" onerror="this.style.display='none'">
        <button class="start-btn" id="startBtn">В ИГРУ</button>
    </div>

    <div class="video-overlay" id="videoOverlay">
        <video id="winVideo" controls>
            <source src="images/VIDEO.mp4" type="video/mp4">
            <source src="images/VIDEO.webm" type="video/webm">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <h1>🏒 Хоккейное Мемори</h1>

    <div class="controls">
        <div class="level-selector" id="levelSelector">
            <button class="level-btn active" data-level="0">3×3</button>
            <button class="level-btn" data-level="1">3×4</button>
            <button class="level-btn" data-level="2">4×4</button>
        </div>
        <button class="sound-toggle" id="soundToggle" title="Включить/выключить звук">🔊</button>
    </div>

    <div class="header">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="stats" id="stats">Уровень 1 · Пары: 0 / 4</div>
        <button class="restart-btn" id="restartBtn">🔄 Заново</button>
    </div>

    <div class="game-wrapper">
        <div class="game-board size-3x3" id="gameBoard"></div>
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-content">
            <h2>🏆 Победа!</h2>
            <p id="winMessage">Ты нашёл все пары!</p>
            <div class="fact-box" id="factBox">
                💡 Хоккей с шайбой зародился в Канаде в середине XIX века!
            </div>
            <div>
                <button class="next-level-btn" id="nextLevelBtn">Следующий уровень →</button>
                <button class="restart-btn" id="modalRestartBtn">Заново</button>
            </div>
        </div>
    </div>

    <div class="status-message" id="statusMessage"></div>

    <script>
        const levels = [
            { rows: 3, cols: 3, name: '3×3', pairs: 4, hasLogo: true },
            { rows: 3, cols: 4, name: '3×4', pairs: 6, hasLogo: false },
            { rows: 4, cols: 4, name: '4×4', pairs: 8, hasLogo: false }
        ];

        // ✅ ИСПРАВЛЕНО: bopot вместо borot
        const allImages = [
            'bopot', 'brat', 'chas', 'kep', 'kliu', 'kom',
            'kon1', 'kon2', 'krag', 'kub', 'logo', 'med',
            'shaib', 'shar', 'stad', 'tren', 'xok', 'xudi'
        ];

        const hockeyFacts = [
            '🏒 Хоккей с шайбой зародился в Канаде в середине XIX века!',
            '⚡ Шайба может лететь со скоростью до 180 км/ч!',
            '🥅 Стандартные ворота в хоккее: 183 см в ширину и 122 см в высоту',
            '🏆 Кубок Стэнли — старейший трофей в профессиональном спорте Северной Америки',
            '⛸️ Коньки хоккеиста затачиваются под индивидуальный стиль игры',
            '🔴 Шайба изготавливается из вулканизированной резины',
            '📏 Длина хоккейной площадки: 60 метров, ширина: 30 метров',
            '👥 В хоккее одновременно на льду находятся 12 игроков (по 6 от каждой команды)',
            '🧊 Лёд на хоккейной площадке имеет толщину около 4 см',
            '📊 Самая результативная игра в истории НХЛ закончилась со счётом 14:7',
            '⏱️ Стандартный матч состоит из трёх периодов по 20 минут',
            '🥅 Вратарская клюшка отличается от полевой — она шире'
        ];

        let currentLevel = 0;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let isLocked = false;
        let soundEnabled = true;
        let gameStarted = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function showStatus(message, duration = 3000) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), duration);
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'success') {
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'error') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'flip') {
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                        osc.start(audioCtx.currentTime + i * 0.15);
                        osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                } else if (type === 'logo') {
                    oscillator.frequency.setValueAtTime(660, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'puck') {
                    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createFlyingPucks() {
            const puckCount = 6;
            const puckSVG = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="50" rx="45" ry="20" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
                    <ellipse cx="50" cy="45" rx="45" ry="18" fill="#2a2a2a"/>
                    <rect x="5" y="45" width="90" height="10" fill="#1a1a1a"/>
                    <text x="50" y="53" text-anchor="middle" fill="#DC143C" font-size="12" font-weight="bold">NHL</text>
                </svg>
            `;
            
            for (let i = 0; i < puckCount; i++) {
                const puck = document.createElement('div');
                puck.className = 'flying-puck';
                puck.innerHTML = puckSVG;
                
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight;
                puck.style.left = startX + 'px';
                puck.style.top = startY + 'px';
                
                const speedX = (Math.random() - 0.5) * 3;
                const speedY = (Math.random() - 0.5) * 3;
                puck.dataset.speedX = speedX;
                puck.dataset.speedY = speedY;
                
                puck.addEventListener('click', function() {
                    if (this.classList.contains('flipping')) return;
                    this.classList.add('flipping');
                    playSound('puck');
                    setTimeout(() => {
                        this.classList.remove('flipping');
                    }, 800);
                });
                
                document.body.appendChild(puck);
            }
        }

        function animatePucks() {
            const pucks = document.querySelectorAll('.flying-puck');
            pucks.forEach(puck => {
                let x = parseFloat(puck.style.left);
                let y = parseFloat(puck.style.top);
                let speedX = parseFloat(puck.dataset.speedX);
                let speedY = parseFloat(puck.dataset.speedY);
                
                x += speedX;
                y += speedY;
                
                if (x <= 0 || x >= window.innerWidth - 50) {
                    speedX = -speedX;
                    puck.dataset.speedX = speedX;
                }
                if (y <= 0 || y >= window.innerHeight - 50) {
                    speedY = -speedY;
                    puck.dataset.speedY = speedY;
                }
                
                puck.style.left = x + 'px';
                puck.style.top = y + 'px';
            });
            
            requestAnimationFrame(animatePucks);
        }

        function calculateBoardSize() {
            const gameBoard = document.getElementById('gameBoard');
            const level = levels[currentLevel];
            
            const wrapper = document.querySelector('.game-wrapper');
            const availableWidth = wrapper.clientWidth - 20;
            const availableHeight = wrapper.clientHeight - 20;
            
            const gap = Math.min(20, Math.max(8, availableWidth * 0.02));
            
            const cardWidthByWidth = (availableWidth - gap * (level.cols - 1)) / level.cols;
            const cardHeightByHeight = (availableHeight - gap * (level.rows - 1)) / level.rows;
            
            const cardSize = Math.min(cardWidthByWidth, cardHeightByHeight);
            
            const boardWidth = cardSize * level.cols + gap * (level.cols - 1);
            const boardHeight = cardSize * level.rows + gap * (level.rows - 1);
            
            gameBoard.style.width = boardWidth + 'px';
            gameBoard.style.height = boardHeight + 'px';
            gameBoard.style.gap = gap + 'px';
        }

        function createBoard() {
            if (!gameStarted) return;

            const gameBoard = document.getElementById('gameBoard');
            const level = levels[currentLevel];

            gameBoard.innerHTML = '';
            gameBoard.className = `game-board size-${level.rows}x${level.cols}`;
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            isLocked = false;
            updateProgress();

            const shuffledImages = shuffle([...allImages]);
            const selectedImages = shuffledImages.slice(0, level.pairs);
            const cardPairs = [...selectedImages, ...selectedImages];
            shuffle(cardPairs);

            if (level.hasLogo) {
                cardPairs.splice(4, 0, 'logo_center');
            }

            cardPairs.forEach((imageName, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.image = imageName;
                card.dataset.index = index;

                if (imageName === 'logo_center') {
                    card.classList.add('logo-center');
                    card.innerHTML = `
                        <div class="card-face">
                            <img src="images/logo.png" alt="Logo" 
                                 onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'color:#DC143C;font-weight:700;font-size:clamp(1rem,3vw,1.5rem)\'>ЛОГО</div>'">
                        </div>
                    `;
                    playSound('logo');
                } else {
                    const imgSrc = `images/${imageName}.png`;
                    card.innerHTML = `
                        <div class="card-face card-front">
                            <img src="images/RUB1.png" alt="Рубашка" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)'">
                        </div>
                        <div class="card-face card-back">
                            <img src="${imgSrc}" alt="${imageName}" 
                                 onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=image-error>${imageName}</div>'">
                        </div>
                    `;
                    card.addEventListener('click', () => flipCard(card));
                }

                gameBoard.appendChild(card);
                cards.push(card);
            });

            setTimeout(calculateBoardSize, 10);
        }

        function flipCard(card) {
            if (isLocked) return;
            if (card.classList.contains('flipped')) return;
            if (card.classList.contains('matched')) return;
            if (card.classList.contains('logo-center')) return;
            if (flippedCards.length >= 2) return;

            playSound('flip');
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;
            const match = card1.dataset.image === card2.dataset.image;

            setTimeout(() => {
                if (match) {
                    playSound('success');
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    card1.querySelector('.card-back').classList.add('success');
                    card2.querySelector('.card-back').classList.add('success');
                    matchedPairs++;
                    updateProgress();
                    flippedCards = [];
                    isLocked = false;

                    if (matchedPairs === levels[currentLevel].pairs) {
                        setTimeout(showWinVideo, 500);
                    }
                } else {
                    playSound('error');
                    card1.classList.add('error');
                    card2.classList.add('error');
                    card1.querySelector('.card-back').classList.add('error-flash');
                    card2.querySelector('.card-back').classList.add('error-flash');

                    setTimeout(() => {
                        card1.classList.remove('flipped', 'error');
                        card2.classList.remove('flipped', 'error');
                        card1.querySelector('.card-back').classList.remove('error-flash');
                        card2.querySelector('.card-back').classList.remove('error-flash');
                        flippedCards = [];
                        isLocked = false;
                    }, 800);
                }
            }, 600);
        }

        function updateProgress() {
            const level = levels[currentLevel];
            const percentage = (matchedPairs / level.pairs) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('stats').textContent = 
                `Уровень ${currentLevel + 1} (${level.name}) · Пары: ${matchedPairs} / ${level.pairs}`;
        }

        function showWinVideo() {
            playSound('win');
            const videoOverlay = document.getElementById('videoOverlay');
            const winVideo = document.getElementById('winVideo');
            videoOverlay.classList.add('active');
            winVideo.currentTime = 0;
            winVideo.play();

            winVideo.onended = function() {
                videoOverlay.classList.remove('active');
                goToNextLevel();
            };
        }

        function goToNextLevel() {
            const isLastLevel = currentLevel >= levels.length - 1;
            
            if (isLastLevel) {
                showFinalWin();
            } else {
                showStatus('🎉 Уровень пройден! Переход на следующий...', 2000);
                setTimeout(() => {
                    setLevel(currentLevel + 1);
                }, 2000);
            }
        }

        function showFinalWin() {
            const randomFact = hockeyFacts[Math.floor(Math.random() * hockeyFacts.length)];
            document.getElementById('factBox').textContent = '💡 ' + randomFact;
            document.getElementById('winMessage').textContent = 'Ты прошёл все уровни! 🏆';
            document.getElementById('nextLevelBtn').disabled = true;
            document.getElementById('nextLevelBtn').textContent = 'Максимальный уровень!';
            document.getElementById('winModal').classList.add('active');
        }

        function setLevel(levelIndex) {
            currentLevel = levelIndex;
            document.querySelectorAll('.level-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === levelIndex);
            });
            document.getElementById('winModal').classList.remove('active');
            createBoard();
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('splashScreen').style.display = 'none';
            gameStarted = true;
            createBoard();
            createFlyingPucks();
            animatePucks();
        });

        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setLevel(parseInt(btn.dataset.level));
            });
        });

        document.getElementById('restartBtn').addEventListener('click', createBoard);
        
        document.getElementById('modalRestartBtn').addEventListener('click', () => {
            document.getElementById('winModal').classList.remove('active');
            createBoard();
        });

        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            if (currentLevel < levels.length - 1) {
                setLevel(currentLevel + 1);
            }
        });

        const soundToggle = document.getElementById('soundToggle');
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            soundToggle.classList.toggle('muted', !soundEnabled);
        });

        window.addEventListener('resize', () => {
            if (gameStarted) {
                calculateBoardSize();
            }
        });
    </script>
</body>
</html>
